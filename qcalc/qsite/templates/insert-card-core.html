<!DOCTYPE html>
<html lang="en">
{% include 'insert-head.html' %}
<body>
<!-- template:insert-card-core -->
{% load static %}
{% load qfilter %}
{% lineless_ex %}
<div class="content" hx-ext="response-targets">
    <div id="card-holder-{{ input.cid }}" class="calc show"
      data-qcalc-cid="{{ input.cid }}"
      data-qcalc-func="{{ input.doc.name|default:'' }}"
      data-qcalc-single-instance="{% if input.doc.info.single_instance %}1{% else %}0{% endif %}"
      data-qcalc-single-key="{% if input.doc.info.single_instance_key %}{{ input.doc.info.single_instance_key }}{% else %}{{ input.doc.name|default:'' }}{% endif %}">
    <script>setCid('{{ input.cid }}');</script>
    <!-- Basic card -->
    <div class="card">
      <div class="card-header bg-card-header">
        <h5 class="card-title">{% block cardtitle %}Basic card{% endblock %}</h5>
      </div>

      <div class="card-body" id="card-body-{{ input.cid }}">
        {% block content %}{% endblock %}
      </div>
    </div>
    <script>
      $(document).ready(function() {
        jumpTo( '{{ input.cid }}' );
        //formReady('{{ input.cid }}');
      });
    </script>
  </div>
</div>
{% endlineless_ex %}
</body>
</html>
