{% extends "insert-card.html" %}
{% block cardtitle %}{{ data.title }}{% endblock %}
{% block content %}
<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">{{ data.title }}</h5>
    </div>
    <div class="modal-body">
      <p>{{ data.body }}</p>
    </div>
    <div class="modal-footer">
      <button type="button"
              onclick="javascript:document.getElementById('card-holder-{{ input.cid }}').remove()"
              class="btn btn-secondary" data-bs-dismiss="modal" aria-label="close">Close</button>
    </div>
  </div>
</div>
{% endblock %}
