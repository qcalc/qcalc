{% load qfilter %}
{% cal_var_url input.doc.info.name input_id True True True request.is_public as url %}
{% if not request.embed %}
<p></p>
<div class="social-share-buttons d-print-none">
  {% if url %}
    <!-- Facebook -->
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ url }}"
       target="_blank" class="btn"><i class="icon-facebook"></i>
    </a>

    <!-- Twitter -->
    <a href="https://twitter.com/intent/tweet?url={{ url }}"
       target="_blank" class="btn"><i class="icon-twitter"></i>
    </a>

    <!-- LinkedIn -->
    <a href="https://www.linkedin.com/shareArticle?url={{ url }}"
       target="_blank" class="btn"><i class="icon-linkedin"></i>
    </a>
    <!-- Email -->
    <a href="/calc/share_by_email/"
       hx-get="/calc/add/?path=share_by_email/func_id/{{ input.doc.info.name }}/url/{{ url|deslash }}/---/"
       hx-target="closest .calc" hx-swap="afterend" class="btn"><i class="icon-envelop"></i>
    </a>
    <!-- Embed -->
    <a href="/calc/embed_code/"
       hx-get="/calc/add/?path=embed_code/func_id/{{ input.doc.info.name }}/"
       hx-target="closest .calc" hx-swap="afterend" class="btn" title="Embed"><i class="icon-embed2"></i>
    </a>
  {% endif %}
    <!-- Favorites -->
    {% include 'favorite_icon_social.html' %}
    {% include 'share_icon_social.html' %}
</div>
{% endif %}
