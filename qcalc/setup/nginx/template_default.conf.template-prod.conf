# nginx configuration template file version default.conf.template v1.8j
# Rename this file to default.conf.template and copy to ../nginx/templates folder
# ${NGIN_HOST} will be replaced by nginx docker container and the file wll be renamed to default.conf
# and will be placed in ../nginx/conf folder

# Use NGINX to cache responses from Django for anonymous users.
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=django_cache:10m max_size=1g inactive=60m use_temp_path=off;

# Define the upstream server (replace with IP if static)
# Reduce or increase the number of upstream servers to serve qcalc
upstream qcalc_servers {
    server qcalc:8001;
    server qcalc:8002;
    server qcalc:8003;
    #server qcalc:8004;
    #server qcalc:8005;
}


# Nginx config allowing HTTP for ACME challenge for www subdomain
server {
    listen 80;
    server_name www.${NGINX_HOST};

	# Block HTTP/0.9 or invalid requests - v1.4j@15.11.24
    if ($block_request) {
        return 444;  # Drop the connection without responding
    }

    # Always allow HTTP access to the ACME challenge for Certbot
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        auth_request off;
        allow all;
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://${NGINX_HOST}$request_uri;
    }
}

# Redirect HTTPS traffic to main domain for www subdomain
server {
    listen 443 ssl;
    http2 on;
    server_name www.${NGINX_HOST};

    ssl_certificate /etc/letsencrypt/live/${NGINX_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NGINX_HOST}/privkey.pem;

    return 301 https://${NGINX_HOST}$request_uri;
}

# Nginx config allowing HTTP for ACME challenge for main domain
server {
    listen 80;
    server_name ${NGINX_HOST};

	# Block HTTP/0.9 or invalid requests - v1.4j@15.11.24
    if ($block_request) {
        return 444;  # Drop the connection without responding
    }

    # Always allow HTTP access to the ACME challenge for Certbot
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        auth_request off;
        allow all;
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://${NGINX_HOST}$request_uri;
    }
}


# Main server block for handling HTTPS traffic
server {
    listen 443 ssl;
    http2 on;
    server_name ${NGINX_HOST};
    access_log /var/log/nginx/access.log;

    # Set Strict-Transport-Security header
    set $sts_header "";
    if ($https) {
        set $sts_header "max-age=31536000; includeSubDomains";
    }
    add_header Strict-Transport-Security $sts_header always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://trusted.cdn.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self';";
    add_header Referrer-Policy "no-referrer";
    add_header Feature-Policy "geolocation 'self'; microphone 'none'; camera 'none'";

    # SSL configuration with strong protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve secp384r1;
    ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    ssl_certificate /etc/letsencrypt/live/${NGINX_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NGINX_HOST}/privkey.pem;

	#  One megabyte of cache contains about 4000 sessions
    ssl_session_cache shared:SSL:20m;
	# If timeout is increased, you need a larger cache to store sessions
    ssl_session_timeout 4h;

    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Serve static files with long expiration and no logging
    location ^~ /static/ {
        alias /usr/src/qcalc_dock/qcalc/staticfiles/;
        expires 30d;
		add_header Cache-Control "public, immutable";
        access_log off;
    }

	# Specify exact match for the request of robots.txt and favicon.ico
    location = /robots.txt {
        alias /usr/src/qcalc_dock/qcalc/staticfiles/txt/robots.${NGINX_HOST}.txt;
    }

	location = /favicon.ico {
        alias /usr/src/qcalc_dock/qcalc/staticfiles/qcalc/images/favicon.png;
    }

    # Proxy pass to the upstream server
    location / {
        # Use NGINX to cache responses from Django for anonymous users
        proxy_cache django_cache;
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_bypass $http_authorization;
        add_header X-Proxy-Cache $upstream_cache_status;

        proxy_pass http://qcalc_servers;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

		# Timeout for establishing a connection with a proxied server
		# This timeout cannot usually exceed 75 seconds
        proxy_connect_timeout 60s;
		# Maximum time for sending a request from Nginx to the upstream server
        proxy_send_timeout 300s;
		# Maximum time for receiving a response by Nginx from the upstream server
        proxy_read_timeout 900s;
		# Nginx to wait for a client to acknowledge data after a response is initiated
        send_timeout 60s;

        # Apply request rate limiting
        limit_req zone=mylimit burst=20 nodelay;

		if ($http_host = "") {
			return 444;  # Drop requests without Host header
		}
    }

    # Deny access to hidden files (e.g., .htaccess)
    location ~ /\.ht {
        deny all;
    }

	# v1.8j
	# Block PHP requests, attackers sometimes scan using phpunit
	# For production environments that don’t use PHP, 444 is the better choice to improve security and reduce noise
    location ~ \.php$ {
        #return 404;  # Not found, Requested resource does not exist
		return 444;  # No response, Drop requests for .php files
    }
}

