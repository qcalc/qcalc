<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>

    <style>

        /* inline editor */
        .inline-margin {
            margin-top: 4px;
        }

        @media (max-width: 560px) {
            .tab button {
                padding: 12px 24px;
            }
        }
        @media (max-width: 475px) {
            .tab button {
                padding: 12px 16px;
            }
        }
        @media (max-width: 407px) {
            .tab button {
                padding: 12px 10px;
            }
        }
        @media (max-width: 380px) {
            .tab button {
                padding: 12px 8px;
            }

    </style>
</head>
<body>

<div class="content">
    <form method="post" id="editor_form">
        {% csrf_token %}
        <textarea id="editor_classic" style="display:none;"
                  name="content">{{ content|safe }}</textarea>
        <div style="background-color:white;">

            <input type="button" value="Save" onclick="save();" style="margin-right:20px;">
            <input type="button" value="Save As..." onclick="saveToFile();" style="margin-right:20px;">

<script>
function save() {
    editorInstance.save();
    var form = document.getElementById("editor_form");
    form.submit();
}

function saveToFile() {
    editorInstance.save();
  // Get the content of the textbox
  const textboxContent = document.getElementsByClassName("sun-editor-editable")[0].innerHTML;

  // Create a blob with the content
  const blob = new Blob([textboxContent], { type: 'text/html' });

  // Create a temporary URL for the blob
  const url = window.URL.createObjectURL(blob);

  // Create a link element
  const a = document.createElement('a');
  a.href = url;

  // Set the filename for the download
  a.download = 'file.html';

  // Append the link to the body
  document.body.appendChild(a);

  // Trigger the download
  a.click();

  // Clean up
  window.URL.revokeObjectURL(url);
  document.body.removeChild(a);
}
</script>
