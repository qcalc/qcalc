<!-- template:include-toast -->
<div id="qcalc-toast-host" aria-live="polite" aria-atomic="true"></div>
<style>
  #qcalc-toast-host {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 1080;
    width: 22rem;
    max-width: calc(100vw - 1rem);
  }
  #qcalc-toast-host .toast {
    margin-bottom: 0.5rem;
  }
  @media (max-width: 576px) {
    #qcalc-toast-host {
      left: 0.5rem;
      right: 0.5rem;
      top: 0.5rem;
      width: auto;
      max-width: none;
    }
  }
</style>
<script>
(function() {
  function esc(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function toastClass(level) {
    var lv = String(level || 'warning').toLowerCase();
    if (lv === 'danger') return 'bg-danger text-white';
    if (lv === 'success') return 'bg-success text-white';
    if (lv === 'info') return 'bg-info text-white';
    return 'bg-warning text-dark';
  }

  document.body.addEventListener('qcalc:toast', function(event) {
    var detail = event && event.detail ? event.detail : {};
    var toastId = 'qcalc-toast-' + Date.now() + '-' + Math.floor(Math.random() * 100000);
    var title = esc(detail.title || 'Notice');
    var body = esc(detail.body || '');
    var levelClass = toastClass(detail.level);
    var delay = Number(detail.delay || 2000);
    var host = document.getElementById('qcalc-toast-host');

    if (!host) return;

    var html = ''
      + '<div id="' + toastId + '" class="toast ' + levelClass + '" role="alert" aria-live="assertive" aria-atomic="true" data-delay="' + delay + '">'
      + '  <div class="toast-header">'
      + '    <strong class="mr-auto">' + title + '</strong>'
      + '    <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">'
      + '      <span aria-hidden="true">&times;</span>'
      + '    </button>'
      + '  </div>'
      + '  <div class="toast-body">' + body + '</div>'
      + '</div>';

    host.insertAdjacentHTML('beforeend', html);

    var $toast = $('#' + toastId);
    $toast.on('hidden.bs.toast', function() {
      this.remove();
    });
    $toast.toast({ autohide: true, delay: delay });
    $toast.toast('show');
  });
})();
</script>
